apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-pod
  template:
    metadata:
      labels:
        app: mongo-pod
    spec:
      serviceAccountName: bsc-ssd-y4-2025-sa
      containers:
        - name: mongo
          image: bitnami/mongodb:latest
          env:
            - name: MONGODB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: password
            - name: MONGODB_ROOT_USER
              valueFrom:
                configMapKeyRef:
                  name: mongodb-config
                  key: username
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-volume
              mountPath: /bitnami/mongodb   
            - name: mongo-config-test
              mountPath: /bitnami           
      volumes:
        - name: mongo-volume
          persistentVolumeClaim:
            claimName: my-mongo-pvc
        - name: mongo-config-test
          configMap:
            name: mongodb-config
            items:
              - key: sample.conf
                path: test.conf